#
# Label definitions for Lurnia, synced by .github/workflows/labels.yml.
# Kept as code so labels are reviewable and reproducible instead of clicked in
# by hand and drifting between contributors.

# --- type: what kind of change is this -------------------------------------
- name: "type: feature"
  color: "0e8a16"
  description: "A new capability"
- name: "type: bug"
  color: "d73a4a"
  description: "Something is broken"
- name: "type: docs"
  color: "0075ca"
  description: "Documentation only"
- name: "type: refactor"
  color: "fbca04"
  description: "No behaviour change"
- name: "type: test"
  color: "5319e7"
  description: "Tests only"
- name: "type: chore"
  color: "c5def5"
  description: "Tooling, deps, housekeeping"
- name: "type: perf"
  color: "f9d0c4"
  description: "Performance"

# --- area: which part of the project --------------------------------------
- name: "area: kernel"
  color: "1d76db"
  description: "Kernel: config / log / storage / bus"
- name: "area: design"
  color: "bfd4f2"
  description: "docs/design — the design source of truth"
- name: "area: roadmap"
  color: "d4c5f9"
  description: "docs/roadmap — items and version assignment"
- name: "area: packaging"
  color: "fef2c0"
  description: "Tauri bundling and the PyInstaller sidecar"
- name: "area: ci"
  color: "ededed"
  description: "GitHub Actions, gates, release automation"
- name: "area: ui"
  color: "ff9ff3"
  description: "Frontend / Tauri WebView"
- name: "area: permissions"
  color: "b60205"
  description: "Permission decisions and subjects"
- name: "area: notes"
  color: "006b75"
  description: "Notes module"
- name: "area: projects"
  color: "0052cc"
  description: "Projects module"
- name: "area: ai"
  color: "8b5cf6"
  description: "AI tooling"

# --- invariant: which invariant does this touch? --------------------------
# A change that touches an invariant needs its executable test to be updated
# (docs/design/invariants.md requires every invariant to be realized as a test).
- name: "invariant"
  color: "b60205"
  description: "Touches one of the nine invariants — update its conformance test"
- name: "invariant: I9"
  color: "b60205"
  description: "APP must not take unauthorized outward action"

# --- status ----------------------------------------------------------------
- name: "needs: design"
  color: "fbca04"
  description: "Needs a design document before implementation"
- name: "needs: repro"
  color: "fbca04"
  description: "Cannot be acted on without a reproduction"
- name: "blocked"
  color: "000000"
  description: "Waiting on something else"
- name: "good first issue"
  color: "7057ff"
  description: "A reasonable entry point for a new contributor"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is welcome"
- name: "duplicate"
  color: "cfd3d7"
  description: "Already reported"
- name: "wontfix"
  color: "ffffff"
  description: "Will not be worked on"

# --- dependency ------------------------------------------------------------
- name: "dependencies"
  color: "0366d6"
  description: "Dependency update"
- name: "dependencies: python"
  color: "0366d6"
  description: "uv / PyPI dependency update"
- name: "dependencies: node"
  color: "0366d6"
  description: "pnpm / npm dependency update"
- name: "dependencies: rust"
  color: "0366d6"
  description: "Cargo dependency update"

# --- release / versioning --------------------------------------------------
# The project does not commit to a 1.0; versioning follows docs/design/versioning.md.
- name: "release: 0.x"
  color: "c2e0c6"
  description: "Lands in a 0.x MINOR"
- name: "versioning"
  color: "c2e0c6"
  description: "Affects versioning or the deprecation pipeline"
- name: "breaking"
  color: "e11d21"
  description: "Breaking change — must follow the deprecation pipeline first"
