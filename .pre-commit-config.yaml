#
# Local mirror of the CI gates, so a failure is caught before the push rather
# than after it. The authoritative list lives in AGENTS.md §5; keep the two in
# step when a gate is added.
#
# Install once:  uv run python -m pre_commit install --install-hooks

default_language_version:
  python: python3.14

ci:
  autoupdate_schedule: monthly

repos:
  # --- file hygiene -----------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # SQL fixtures and generated files may legitimately keep spacing.
        exclude: ^.*\.(sql|lock)$
      - id: end-of-file-fixer
        exclude: ^.*\.(lock)$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        # tsconfig.json is JSONC **by design** — TypeScript documents the
        # comments, and the Tauri template ships them. A strict-JSON parser can
        # only fail on it, which made `pre-commit run --all-files` red for a
        # reason unrelated to any change (the same trap the gitleaks note at the
        # bottom describes). Removing the comments to please the hook would mean
        # deleting documentation; excluding the file is the honest fix.
        # Every other .json in the tree is still parsed strictly.
        exclude: ^app/tsconfig.*\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: detect-private-key
      # The symlink and case checks matter on Windows contributors' machines.
      - id: check-symlinks
      - id: check-executables-have-shebangs

  # --- Python gates (mirror of CI) --------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # --- Frontend gates (mirror of CI) ------------------------------------
  # The frontend lives in app/ and is a pnpm project of its own, so these go
  # through `pnpm --dir app`. They only fire when something under app/ changes.
  #
  # All of them use pass_filenames: false on purpose: the tools already have
  # their own ignore lists (.prettierignore, eslint's ignores, stylelint's
  # glob), and re-declaring a file list here is how the two drift apart.
  #
  # Tests and the production build are NOT here — they run in CI, exactly like
  # pytest does (the Python hooks are lint/format only too).
  - repo: local
    hooks:
      - id: frontend-spdx
        name: frontend SPDX headers
        language: system
        # node, not a pnpm script: this has to run without touching node_modules.
        entry: node app/scripts/check-spdx.mjs
        files: ^app/
        pass_filenames: false
      - id: frontend-eslint
        name: frontend eslint
        language: system
        entry: pnpm --dir app run lint:js
        files: ^app/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
      - id: frontend-stylelint
        name: frontend stylelint
        language: system
        entry: pnpm --dir app run lint:css
        files: ^app/.*\.css$
        pass_filenames: false
      - id: frontend-prettier
        name: frontend prettier check
        language: system
        entry: pnpm --dir app run format:check
        files: ^app/
        pass_filenames: false

  # --- secrets ----------------------------------------------------------
  # gitleaks is NOT wired as a pre-commit hook on purpose: its pre-commit
  # wrapper builds from source and therefore needs a Go toolchain plus network
  # access to the module proxy. That makes `pre-commit run --all-files` fail in
  # a way that has nothing to do with this repository's code, which is exactly
  # the kind of gate people learn to ignore.
  #
  # Secret scanning runs in CI instead, where the runner has the toolchain:
  # see .github/workflows/ (gitleaks step) and CodeQL.
  - repo: local
    hooks:
      - id: no-committed-secrets
        name: no obvious committed secrets
        language: system
        # `python` alone is not on PATH on every platform (notably Windows);
        # go through uv, which this project already requires.
        entry: uv run --no-sync python script/check_secrets.py
        files: .*
        pass_filenames: false
