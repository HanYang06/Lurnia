[project]
name = "lurnia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HanYang06", email = "jihanyang123@163.com" }
]
requires-python = ">=3.14"

[project.scripts]
lurnia = "lurnia:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

dependencies = [
    "onconf>=2.1.0",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "ruff>=0.17.0",
]

tests = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.16.0",
    "pytest-xdist>=3.8.0",
]
